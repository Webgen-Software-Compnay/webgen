<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Categories API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        .api-test {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            padding: 1rem;
            margin: 1rem 0;
        }
        .status-success { color: #198754; }
        .status-error { color: #dc3545; }
        .status-warning { color: #ffc107; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1>🧪 Common Complaint Categories API Test</h1>
        <p class="text-muted">Test the category loading functionality for the Common Complaint creation form.</p>
        
        <div class="row">
            <div class="col-md-6">
                <div class="api-test">
                    <h5>📡 API Endpoint Tests</h5>
                    <button class="btn btn-primary" onclick="testCategoriesEndpoint()">Test Categories API</button>
                    <button class="btn btn-secondary ms-2" onclick="testBackendAPI()">Test Backend API</button>
                    <div id="apiResults" class="mt-3"></div>
                </div>
                
                <div class="api-test">
                    <h5>🎯 Select2 Integration Test</h5>
                    <label for="testCategorySelect" class="form-label">Category Selection:</label>
                    <select class="form-control" id="testCategorySelect" style="width: 100%;">
                        <option value="">Loading categories...</option>
                    </select>
                    <div id="select2Results" class="mt-2"></div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="api-test">
                    <h5>📊 Test Results</h5>
                    <div id="testLog" style="background: #000; color: #00ff00; padding: 15px; border-radius: 5px; font-family: monospace; height: 400px; overflow-y: auto;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <script>
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logDiv = document.getElementById('testLog');
            const colorMap = {
                'info': '#00ff00',
                'error': '#ff4444',
                'warning': '#ffaa00',
                'success': '#44ff44'
            };
            logDiv.innerHTML += `<div style="color: ${colorMap[type]}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        function testCategoriesEndpoint() {
            log('🧪 Testing /admin/common-complaints/categories endpoint...', 'info');
            
            fetch('/admin/common-complaints/categories')
                .then(response => {
                    log(`📡 Response Status: ${response.status}`, response.ok ? 'success' : 'error');
                    return response.json();
                })
                .then(data => {
                    log(`📊 Response Data: ${JSON.stringify(data, null, 2)}`, 'info');
                    
                    if (data.success && Array.isArray(data.data)) {
                        log(`✅ Successfully loaded ${data.data.length} categories`, 'success');
                        document.getElementById('apiResults').innerHTML = `
                            <div class="alert alert-success">
                                <strong>Success!</strong> Loaded ${data.data.length} categories from API.
                                <details class="mt-2">
                                    <summary>View Categories</summary>
                                    <pre>${JSON.stringify(data.data, null, 2)}</pre>
                                </details>
                            </div>
                        `;
                        initializeSelect2WithData(data.data);
                    } else {
                        log(`⚠️ Unexpected response format`, 'warning');
                        document.getElementById('apiResults').innerHTML = `
                            <div class="alert alert-warning">
                                <strong>Warning!</strong> Unexpected response format.
                                <pre>${JSON.stringify(data, null, 2)}</pre>
                            </div>
                        `;
                    }
                })
                .catch(error => {
                    log(`❌ API Error: ${error.message}`, 'error');
                    document.getElementById('apiResults').innerHTML = `
                        <div class="alert alert-danger">
                            <strong>Error!</strong> API request failed: ${error.message}
                        </div>
                    `;
                });
        }

        function testBackendAPI() {
            log('🧪 Testing backend API directly...', 'info');
            
            // Test the backend API endpoints that should be running on port 8080
            const backendEndpoints = [
                'http://localhost:8080/api/admin/complaint-categories/get-active',
                'http://localhost:8080/api/admin/complaint-categories/get-all',
                'http://localhost:8080/api/admin/complaint-categories/search'
            ];
            
            backendEndpoints.forEach(endpoint => {
                log(`🌐 Testing: ${endpoint}`, 'info');
                fetch(endpoint)
                    .then(response => {
                        log(`📡 ${endpoint} - Status: ${response.status}`, response.ok ? 'success' : 'error');
                        return response.json();
                    })
                    .then(data => {
                        log(`📊 ${endpoint} - Data count: ${data.data ? data.data.length : 'No data'}`, 'info');
                    })
                    .catch(error => {
                        log(`❌ ${endpoint} - Error: ${error.message}`, 'error');
                    });
            });
        }

        function initializeSelect2WithData(categories) {
            log('🎯 Initializing Select2 with loaded categories...', 'info');
            
            $('#testCategorySelect').select2({
                data: categories.map(cat => ({
                    id: cat.id,
                    text: cat.text || cat.name,
                    description: cat.description || '',
                    category_type: cat.category_type || 'main'
                })),
                placeholder: 'Select a category',
                allowClear: true,
                templateResult: function(category) {
                    if (category.loading) {
                        return $('<div>Loading...</div>');
                    }
                    
                    if (!category.id) {
                        return $('<div>' + category.text + '</div>');
                    }
                    
                    const badge = category.category_type === 'sub' ? 
                        '<span class="badge bg-secondary">Sub</span>' : 
                        '<span class="badge bg-primary">Main</span>';
                    
                    return $(`
                        <div>
                            <div><strong>${category.text}</strong> ${badge}</div>
                            <small class="text-muted">${category.description}</small>
                        </div>
                    `);
                },
                templateSelection: function(category) {
                    return category.text || category.name;
                }
            });
            
            $('#testCategorySelect').on('select2:select', function(e) {
                const data = e.params.data;
                log(`✅ Category selected: ${data.text} (ID: ${data.id})`, 'success');
                document.getElementById('select2Results').innerHTML = `
                    <div class="alert alert-info">
                        <strong>Selected:</strong> ${data.text}<br>
                        <strong>Type:</strong> ${data.category_type}<br>
                        <strong>Description:</strong> ${data.description}
                    </div>
                `;
            });
            
            log('✅ Select2 initialized successfully', 'success');
        }

        // Initialize page
        $(document).ready(function() {
            log('🚀 Category API Test Page Loaded', 'info');
            log('📋 Available Tests:', 'info');
            log('  1. Test Categories API - Tests the Laravel endpoint', 'info');
            log('  2. Test Backend API - Tests direct backend endpoints', 'info');
            log('  3. Select2 Integration - Tests the dropdown functionality', 'info');
            log('', 'info');
            log('Click "Test Categories API" to start testing!', 'warning');
        });
    </script>
</body>
</html>
