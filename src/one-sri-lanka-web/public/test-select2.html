<!DOCTYPE html>
<html>
<head>
    <title>Select2 Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css" rel="stylesheet">
    <style>
        /* Select2 Bootstrap 5 styling */
        .select2-container {
            width: 100% !important;
        }
        
        .select2-container--default .select2-selection--single {
            height: 38px;
            border: 1px solid #ced4da;
            border-radius: 0.375rem;
            padding: 6px 12px;
        }
        
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            color: #495057;
            line-height: 26px;
        }
        
        .select2-container--default .select2-selection--single .select2-selection__arrow {
            height: 36px;
        }
        
        .select2-dropdown {
            border: 1px solid #ced4da;
            border-radius: 0.375rem;
        }
        
        .select2-container--default .select2-results__option--highlighted[aria-selected] {
            background-color: #667eea;
        }
    </style>
</head>
<body class="p-4">
    <div class="container">
        <h2>Select2 Test for Schools</h2>
        
        <div class="mb-3">
            <label for="schoolSelect" class="form-label">School</label>
            <select id="schoolSelect" class="form-control" data-field-type="ndx_school" data-searchable="true">
                <option value="">Loading schools...</option>
            </select>
        </div>
        
        <button id="loadSchools" class="btn btn-primary">Load Schools</button>
        <button id="initSelect2" class="btn btn-secondary">Initialize Select2</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
    <script>
        document.getElementById('loadSchools').addEventListener('click', function() {
            fetch('/api/ndx/schools')
                .then(response => response.json())
                .then(data => {
                    const select = document.getElementById('schoolSelect');
                    select.innerHTML = '<option value="">Select school...</option>';
                    
                    if (data.success && data.data) {
                        data.data.forEach(school => {
                            const option = document.createElement('option');
                            option.value = school.id;
                            option.textContent = school.name;
                            select.appendChild(option);
                        });
                        console.log('Loaded', data.data.length, 'schools');
                    }
                })
                .catch(error => {
                    console.error('Error loading schools:', error);
                });
        });
        
        document.getElementById('initSelect2').addEventListener('click', function() {
            if (typeof $ !== 'undefined' && $.fn.select2) {
                $('#schoolSelect').select2({
                    placeholder: 'Search and select school...',
                    allowClear: true,
                    width: '100%'
                });
                console.log('Select2 initialized');
            } else {
                console.error('jQuery or Select2 not available');
            }
        });
        
        // Auto-load schools on page load
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('loadSchools').click();
        });
    </script>
</body>
</html>
